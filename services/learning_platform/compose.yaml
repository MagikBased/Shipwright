services:
  app:
    build: .
    image: ${JP_ASSIST_APP_IMAGE:-jp-assist-learning-platform:local}
    restart: unless-stopped
    env_file: ${JP_ASSIST_ENV_FILE:-.env}
    environment:
      JP_ASSIST_PLATFORM_DB: /data/platform.sqlite3
      JP_ASSIST_BACKUP_DIR: /backups
      JP_ASSIST_SMTP_HOST: mailpit
      JP_ASSIST_SMTP_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
    volumes:
      - platform-data:/data
      - platform-backups:/backups
    expose:
      - "8766"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/readyz', timeout=3)\""
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    image: ${JP_ASSIST_APP_IMAGE:-jp-assist-learning-platform:local}
    restart: unless-stopped
    env_file: ${JP_ASSIST_ENV_FILE:-.env}
    environment:
      JP_ASSIST_PLATFORM_DB: /data/platform.sqlite3
      JP_ASSIST_BACKUP_DIR: /backups
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        while true; do
          python -m learning_platform.manage backup-scheduled;
          sleep "$${JP_ASSIST_BACKUP_INTERVAL_SECONDS:-86400}";
        done
    volumes:
      - platform-data:/data:ro
      - platform-backups:/backups

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.3@sha256:13de4ffbd28f3089be6dff32afbc8210edb5a593d738fa877ae7272cc73aeb67
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    expose:
      - "1025"
    ports:
      - "127.0.0.1:${JP_ASSIST_MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JP_ASSIST_DOMAIN: ${JP_ASSIST_DOMAIN:?Set JP_ASSIST_DOMAIN in .env}
    ports:
      - "${JP_ASSIST_BIND_ADDRESS:-0.0.0.0}:${JP_ASSIST_HTTP_PORT:-80}:80"
      - "${JP_ASSIST_BIND_ADDRESS:-0.0.0.0}:${JP_ASSIST_HTTPS_PORT:-443}:443"
      - "${JP_ASSIST_BIND_ADDRESS:-0.0.0.0}:${JP_ASSIST_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  prometheus:
    image: docker.io/prom/prometheus:v3.5.5@sha256:332c2f43e7e389d74d3893b55bb02fbbd684208e681eeb604641d5d769c0fe2a
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:${JP_ASSIST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: docker.io/grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${JP_ASSIST_GRAFANA_ADMIN_PASSWORD:?Set JP_ASSIST_GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jp-assist.json
    ports:
      - "127.0.0.1:${JP_ASSIST_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  platform-data:
  platform-backups:
  caddy-data:
  caddy-config:
  mailpit-data:
  prometheus-data:
  grafana-data:
