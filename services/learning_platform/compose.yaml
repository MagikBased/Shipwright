services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${JP_ASSIST_ENV_FILE:-.env}
    environment:
      JP_ASSIST_PLATFORM_DB: /data/platform.sqlite3
      JP_ASSIST_SMTP_HOST: mailpit
      JP_ASSIST_SMTP_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
    volumes:
      - platform-data:/data
      - platform-backups:/backups
    expose:
      - "8766"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.3@sha256:9e8d3b983691010021445c03ee400dcacef91311e232546c5cd88cbc0fcd2fce
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JP_ASSIST_DOMAIN: ${JP_ASSIST_DOMAIN:?Set JP_ASSIST_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  platform-data:
  platform-backups:
  caddy-data:
  caddy-config:
  mailpit-data:
